services:
  ai:
    image: ghcr.io/doubleangels/ai:latest
    container_name: ai
    restart: unless-stopped
    mem_limit: 512m
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    read_only: true
    env_file:
      - path: .env.doppler
        required: false
    environment:
      - NODE_OPTIONS=--max-old-space-size=256
    tmpfs:
      - /tmp

